<?xml version="1.0" encoding="UTF-8"?>
<!-- Transball GL's GlowIcon art: a thrust ship in a dark cavern, towing a
     glowing energy sphere on its tractor beam. The AmiCradle Team's own drawing. -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="sphere" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#9ff7ff"/>
      <stop offset="1" stop-color="#1080c0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fe8ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#7fe8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a4a"/>
      <stop offset="1" stop-color="#3a2a1c"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f6ff"/>
      <stop offset="0.6" stop-color="#a8b4d0"/>
      <stop offset="1" stop-color="#4a5470"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2a0"/>
      <stop offset="1" stop-color="#ff5010" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- cavern roof and floor -->
  <path d="M0 0 H128 V18 L112 26 L96 16 L78 24 L60 12 L40 22 L22 14 L0 24 Z" fill="url(#rock)" stroke="#20160c" stroke-width="2"/>
  <path d="M0 128 V108 L18 100 L34 110 L52 98 L70 112 L90 102 L108 112 L128 104 V128 Z" fill="url(#rock)" stroke="#20160c" stroke-width="2"/>
  <!-- tractor beam -->
  <path d="M64 68 L52 88" stroke="#7fe8ff" stroke-width="3" stroke-dasharray="4 3"/>
  <!-- energy sphere -->
  <circle cx="48" cy="94" r="18" fill="url(#glow)"/>
  <circle cx="48" cy="94" r="10" fill="url(#sphere)" stroke="#0a3c60" stroke-width="2"/>
  <!-- thrust flame -->
  <path d="M74 66 L90 90 L82 64 Z" fill="url(#flame)"/>
  <!-- ship -->
  <g transform="rotate(-25 72 52)">
    <path d="M72 30 L88 66 L72 60 L56 66 Z" fill="url(#hull)" stroke="#1a2040" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M72 40 L77 54 L67 54 Z" fill="#40c0ff" stroke="#1a2040" stroke-width="1.5"/>
  </g>
</svg>
